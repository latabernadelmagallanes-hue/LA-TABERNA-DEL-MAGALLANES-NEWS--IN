<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="web_standard" name="shell-type">
<title>Sala CMS | Redacción Editorial</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- MODAL DE LOGIN INSTITUCIONAL -->
  <div id="modal-cms-login" class="fixed inset-0 z-50 bg-slate-950/90 flex items-center justify-center p-4">
    <div class="bg-slate-900 w-full max-w-md rounded-2xl border border-slate-800 p-6 space-y-6 shadow-2xl">
      <div class="flex items-center gap-3 border-b border-slate-800 pb-4">
        <div class="w-10 h-10 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-bold">
          <span class="material-symbols-outlined">lock</span>
        </div>
        <div>
          <h3 class="font-bold text-lg text-white">Acceso Sala CMS</h3>
          <p class="text-xs text-slate-400">Área exclusiva del Director y Redacción</p>
        </div>
      </div>
      <form id="form-cms-login" class="space-y-4">
        <div>
          <label class="block font-mono text-xs uppercase text-slate-400 font-bold mb-1">Contraseña de Acceso</label>
          <input type="password" id="cms-password-input" required placeholder="Clave: magallanes2026" 
                 class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl font-mono text-sm text-white focus:border-amber-500 outline-none">
        </div>
        <div id="login-error-msg" class="hidden text-rose-400 font-mono text-xs bg-rose-950/50 p-2.5 rounded-lg">Contraseña incorrecta. Intente nuevamente.</div>
        <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-mono text-xs uppercase font-bold rounded-xl transition">
          Ingresar al Panel Editorial
        </button>
      </form>
      <div class="text-center">
        <a href="index.html" class="font-mono text-xs text-slate-400 hover:text-white">← Volver al Portal Público</a>
      </div>
    </div>
  </div>

  <!-- DASHBOARD DE REDACCIÓN (OCULTO HASTA AUTENTICARSE) -->
  <div id="dashboard-cms-editorial" class="hidden flex-1 flex flex-col">
    <header class="bg-slate-950 border-b border-slate-800 px-6 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-amber-500">edit_document</span>
        <h2 class="font-bold text-lg">Sala de Redacción CMS • Procesador Estilo Word</h2>
      </div>
      <a href="index.html" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-mono rounded-lg transition">Ver Portal Público</a>
    </header>

    <div class="flex-1 flex flex-col lg:flex-row p-6 gap-6 max-w-[1400px] mx-auto w-full">
      
      <!-- LIENZO DE ESCRITURA ENRIQUECIDA -->
      <div class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col overflow-hidden shadow-lg">
        <!-- Barra de Herramientas Estilo Word -->
        <div class="bg-slate-950 border-b border-slate-800 p-2.5 flex flex-wrap gap-2 text-xs font-mono items-center">
          <button onclick="document.execCommand('bold', false, null)" class="p-1.5 bg-slate-800 hover:bg-slate-700 rounded font-bold" title="Negrita"><b>B</b></button>
          <button onclick="document.execCommand('italic', false, null)" class="p-1.5 bg-slate-800 hover:bg-slate-700 rounded italic" title="Cursiva"><i>I</i></button>
          <button onclick="document.execCommand('underline', false, null)" class="p-1.5 bg-slate-800 hover:bg-slate-700 rounded underline" title="Subrayado"><u>U</u></button>
          <span class="w-px h-5 bg-slate-800 mx-1"></span>
          <button onclick="document.execCommand('formatBlock', false, '<h1>')" class="px-2 py-1 bg-slate-800 rounded font-bold">H1</button>
          <button onclick="document.execCommand('formatBlock', false, '<h2>')" class="px-2 py-1 bg-slate-800 rounded font-bold">H2</button>
          <button onclick="document.execCommand('insertUnorderedList', false, null)" class="px-2 py-1 bg-slate-800 rounded">Viñetas</button>
          <button onclick="document.execCommand('insertOrderedList', false, null)" class="px-2 py-1 bg-slate-800 rounded">Num.</button>
          <button onclick="document.execCommand('formatBlock', false, '<blockquote>')" class="px-2 py-1 bg-slate-800 rounded">Cita</button>
        </div>

        <div class="p-6 md:p-10 flex-1 overflow-y-auto space-y-4 bg-white text-slate-900">
          <input type="text" id="editor-title" placeholder="Título de la Noticia o Reportaje..." 
                 class="w-full text-2xl md:text-3xl font-bold bg-transparent border-b border-slate-200 pb-2 focus:outline-none placeholder:text-slate-400">
          <input type="text" id="editor-lead" placeholder="Bajada o resumen introductorio..." 
                 class="w-full text-sm italic bg-transparent border-b border-slate-200 pb-2 focus:outline-none placeholder:text-slate-400 text-slate-600">
          <div id="word-editor-canvas" contenteditable="true" placeholder="Redacta el cuerpo completo del artículo aquí..." 
               class="min-h-[450px] focus:outline-none text-slate-800 leading-relaxed font-sans"></div>
        </div>
      </div>

      <!-- PANEL LATERAL DE CONFIGURACIÓN -->
      <div class="w-full lg:w-80 bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 h-fit">
        <h3 class="font-bold text-sm uppercase font-mono text-amber-500">Publicación & Destino</h3>
        <div>
          <label class="block font-mono text-xs text-slate-400 mb-1">Módulo Destino</label>
          <select id="editor-target" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-mono text-white outline-none">
            <option value="carrusel_0">Carrusel Nota #1 (Portada)</option>
            <option value="carrusel_1">Carrusel Nota #2 (Portada)</option>
            <option value="carrusel_2">Carrusel Nota #3 (Portada)</option>
            <option value="carrusel_3">Carrusel Nota #4 (Portada)</option>
            <option value="carrusel_4">Carrusel Nota #5 (Portada)</option>
            <option value="cronica_new">Grid de Crónicas</option>
          </select>
        </div>
        <div>
          <label class="block font-mono text-xs text-slate-400 mb-1">Etiqueta / Categoría</label>
          <input type="text" id="editor-tag" value="Sabermetría" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none">
        </div>
        <div>
          <label class="block font-mono text-xs text-slate-400 mb-1">Imagen Destacada (URL)</label>
          <input type="text" id="editor-img" placeholder="https://..." class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none">
        </div>
        <button id="btn-publish" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-mono text-xs uppercase font-bold rounded-xl shadow transition">
          Publicar en el Portal
        </button>
      </div>

    </div>
  </div>

  <script>
    let portalData = JSON.parse(localStorage.getItem('taberna_cms_master_data')) || {
      articles: [],
      cronicas: []
    };

    document.getElementById('form-cms-login').onsubmit = (e) => {
      e.preventDefault();
      if(document.getElementById('cms-password-input').value === 'magallanes2026') {
        document.getElementById('modal-cms-login').classList.add('hidden');
        document.getElementById('dashboard-cms-editorial').classList.remove('hidden');
      } else {
        document.getElementById('login-error-msg').classList.remove('hidden');
      }
    };

    document.getElementById('btn-publish').onclick = () => {
      const title = document.getElementById('editor-title').value;
      const lead = document.getElementById('editor-lead').value;
      const body = document.getElementById('word-editor-canvas').innerHTML;
      const tag = document.getElementById('editor-tag').value;
      const bgImg = document.getElementById('editor-img').value || 'https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?q=80&w=1200&auto=format&fit=crop';
      const target = document.getElementById('editor-target').value;

      if(!title) {
        alert('Por favor introduce un título para la noticia.');
        return;
      }

      const newArt = { title, lead, body, tag, date: "30 Oct, 2026", bgImg };

      if(target.startsWith('carrusel_')) {
        const idx = parseInt(target.split('_')[1]);
        if(!portalData.articles) portalData.articles = [];
        portalData.articles[idx] = newArt;
      } else {
        if(!portalData.cronicas) portalData.cronicas = [];
        portalData.cronicas.unshift(newArt);
      }

      localStorage.setItem('taberna_cms_master_data', JSON.stringify(portalData));
      alert('¡Noticia publicada con éxito en el portal!');
    };
  </script>
</body>
</html>
